<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign and verify messages using your Ethereum account.">
  <meta name="author" content="Shawn Tabrizi">

  <title>Sign and verify messages with Ethereum</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom styles -->
  <link href="custom.css" rel="stylesheet">
</head>

<body>
  <main role="main" class="container">
    <div class="p-4 mb-4 bg-body-tertiary rounded-3 mt-3">
      <h1>Sign and verify messages with Ethereum</h1>
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="hash_check">
        <label class="form-check-label" for="hash_check">Hash message with Keccak-256</label>
      </div>
    </div>
    <div>
      <h3>Sign a message using your Ethereum account</h3>
      <div class="alert alert-info" id="metamask_warning" hidden>You will need
        <a href="https://metamask.io/">MetaMask</a> (or another Ethereum wallet) to sign a message.
      </div>
      <div class="mb-3">
        <label for="message_to_sign" class="form-label">Message to sign:</label>
        <textarea class="form-control" id="message_to_sign" rows="3"></textarea>
      </div>
      <div class="mb-3">
        <button class="btn btn-primary" id="sign_message_button">Sign Message</button>
      </div>
      <div class="mb-3">
        <label class="form-label">Signature Output:</label>
        <div class="alert alert-secondary code" id="signature_output"></div>
      </div>
    </div>
    <hr>
    <div>
      <h3>Verify a message was signed by an Ethereum account</h3>
      <div class="mb-3">
        <label for="message_to_verify" class="form-label">Message to verify:</label>
        <textarea class="form-control" id="message_to_verify" rows="3"></textarea>
      </div>
      <div class="mb-3">
        <label for="signature" class="form-label">Signature:</label>
        <input class="form-control" type="text" id="signature">
      </div>
      <div class="mb-3">
        <button class="btn btn-primary" id="verify_message_button">Verify Message</button>
      </div>
      <div class="mb-3">
        <label class="form-label">Signing Address:</label>
        <div class="alert alert-secondary code" id="signing_address_output"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <span class="text-muted">Created by
        <a href="https://shawntabrizi.com">Shawn Tabrizi</a> - Source on
        <a href="https://github.com/shawntabrizi/ETH-Sign-and-Verify">GitHub</a> - Using
        <a href="https://docs.ethers.org/">ethers.js</a>
      </span>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
  <script src="eth-sign-verify.js"></script>
</body>

</html>
